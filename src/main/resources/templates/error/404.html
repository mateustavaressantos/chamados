<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Não encontrado')}"></head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: sidebar('')}"></aside>

    <main class="error-page">
        <div class="error-code">404</div>
        <h1>Recurso não encontrado</h1>
        <p th:text="${mensagem} ?: 'A página que você procura não existe.'">O recurso que você procura não existe.</p>
        <div class="actions">
            <a class="btn btn-primary" th:href="@{/web/chamados}">Voltar para chamados</a>
            <a class="btn" th:href="@{/}">Ir ao início</a>
        </div>
    </main>
</div>
</body>
</html>
