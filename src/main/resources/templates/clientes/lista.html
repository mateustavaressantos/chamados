<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<div class="app">

    <aside th:replace="~{fragments/layout :: sidebar('clientes')}"></aside>

    <main class="content">

        <header>
            <h1 style="margin:0;font-size:26px;font-weight:700;">Clientes</h1>
            <p class="subtitle">Cadastro, edição e exclusão de clientes</p>
        </header>

        <div class="alert alert-success" role="status" th:if="${sucesso}" th:text="${sucesso}">Mensagem de sucesso</div>
        <div class="alert alert-error" role="alert" th:if="${erro}" th:text="${erro}">Mensagem de erro</div>

        <div class="two-col">

            <section class="card table-card two-col-main">
                <p class="muted" style="padding:24px;margin:0;" th:if="${linhas.isEmpty()}">Nenhum cliente cadastrado.</p>
                <div class="table-scroll" th:unless="${linhas.isEmpty()}">
                    <table>
                        <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Chamados</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="l : ${linhas}">
                            <td><strong th:text="${l.cliente.nome}">Nome</strong></td>
                            <td th:text="${l.cliente.email}">email@exemplo.com</td>
                            <td th:text="${l.cliente.telefone()}">47999999999</td>
                            <td>
                                <span class="muted" th:if="${l.totalChamados == 0}">Nenhum</span>
                                <a class="link" th:if="${l.totalChamados > 0}"
                                   th:href="@{/web/clientes/{id}/chamados(id=${l.cliente.id})}"
                                   th:text="${l.totalChamados} + (${l.totalChamados == 1} ? ' chamado' : ' chamados')">1 chamado</a>
                            </td>
                            <td class="row-actions">
                                <a class="link" th:href="@{/web/clientes/{id}/editar(id=${l.cliente.id})}">Editar</a>
                                &nbsp;·&nbsp;
                                <a class="link-danger" th:href="@{/web/clientes/{id}/excluir(id=${l.cliente.id})}">Excluir</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <form class="card panel form-stack two-col-side" method="post" th:action="@{/web/clientes}">
                <h2 style="margin:0;">Novo cliente</h2>

                <div class="alert alert-error" role="alert" th:if="${erros != null and !erros.isEmpty()}">
                    <ul>
                        <li th:each="e : ${erros}" th:text="${e}">Mensagem de erro</li>
                    </ul>
                </div>

                <div class="field">
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" type="text" maxlength="100" th:value="${form?.nome()}">
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="text" maxlength="120" th:value="${form?.email()}">
                </div>
                <div class="field">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" name="telefone" type="text" th:value="${form?.telefone()}">
                    <span class="field-hint">Máximo de 20 caracteres</span>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a class="btn" th:href="@{/web/clientes}">Cancelar</a>
                </div>
            </form>

        </div>
    </main>
</div>
</body>
</html>
